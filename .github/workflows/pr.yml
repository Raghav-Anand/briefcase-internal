name: PR Tests

on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server -scheme http -port 4443
          # Wait for the server to be ready.
          for i in $(seq 1 15); do
            curl -sf http://localhost:4443/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project test-project &
          # Wait for the emulator port to be open.
          for i in $(seq 1 30); do
            nc -z localhost 8080 && break
            sleep 1
          done

      - name: Run tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          STORAGE_EMULATOR_HOST: localhost:4443
        run: go test ./...
